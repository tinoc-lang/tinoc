name: CI

# Runs on every push and pull request. Two jobs:
#
# 1. `test` — the project's native pipeline: the full `build.sh ci` /
#    `build.ps1 ci` run (deps, fmt-check, vet, lint, race tests, release
#    build) on every supported OS, followed by a smoke test of the native
#    installer in --local mode.
# 2. `nix` — the hermetic Nix pipeline on Linux + macOS: Determinate Nix
#    installer + Magic Nix Cache, then `nix flake check` (gofmt, vet, race
#    tests, end-to-end samples), `nix build .#tinoc`, and an explicit
#    golangci-lint / go vet / `go test -race` pass inside the dev shell.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run CI pipeline (build.sh ci)
        if: runner.os != 'Windows'
        run: ./build.sh ci

      - name: Run CI pipeline (build.ps1 ci)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 ci

      - name: Smoke-test the native installer (--local)
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tinoc-smoke"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -Command "./install.ps1 -Local -Yes -Dir '$dir'"
          else
            ./install.sh --local --yes --dir "$dir"
          fi
          bin="$dir/bin"
          if [ -f "$bin/tinoc.exe" ]; then "$bin/tinoc.exe" version; else "$bin/tinoc" version; fi
          echo "VERSION file: $(cat "$dir/VERSION")"
          echo "Installer smoke test passed"

      - name: Smoke-test the PowerShell installer (-Local) on unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tinoc-smoke-ps1"
          pwsh -NoProfile -Command "./install.ps1 -Local -Yes -Dir '$dir'"
          "$dir/bin/tinoc" version
          echo "VERSION file: $(cat "$dir/VERSION")"
          echo "PowerShell installer smoke test passed"

  nix:
    name: nix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
      id-token: write # for Magic Nix Cache push access
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix (Determinate Nix)
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache the Nix store (Magic Nix Cache)
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Flake check (gofmt, vet, race tests, end-to-end samples)
        run: nix flake check

      - name: Build the flake package
        run: nix build .#tinoc

      - name: Lint, vet, and race-test inside the dev shell
        run: |
          nix develop . --command bash -euo pipefail -c '
            golangci-lint run ./...
            go vet ./...
            go test -race -timeout 600s ./...
          '
