name: Release

# Builds and publishes a Tinoc release.
#
# Triggers ONLY on tag pushes (e.g. `git tag v0.1.0 && git push origin v0.1.0`),
# never on branch pushes. Cross-compiles the compiler for every supported
# platform via build.sh build-all, packages each binary as .tar.gz (unix) or
# .zip (windows), attaches a SHA256SUMS manifest, and creates a GitHub
# Release with all archives attached (verified by install.sh / install.ps1).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile all targets
        run: ./build.sh build-all

      - name: Package binaries (tar.gz / zip)
        run: |
          set -euo pipefail
          cd dist
          for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            tar -czf "tinoc-${t}.tar.gz" "tinoc-${t}"
          done
          zip tinoc-windows-amd64.zip tinoc-windows-amd64.exe

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum tinoc-* > SHA256SUMS
          echo "Checksums written:"
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
